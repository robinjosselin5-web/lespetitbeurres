<!DOCTYPE html>
<html lang="en">
    <head>
        <script src="https://kit.fontawesome.com/c4ab95abda.js" crossorigin="anonymous"></script>
        <script type="module" src="../js/dynamic-navbar.js"></script>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
        
        <script type="module">
            import { getHead } from '../../modules/head.js';

            document.title = "Les petits beurres";
            document.head.innerHTML += getHead("../..");
        </script>
    </head>
    <body data-theme="themesOne">

        <div class="landscape"></div>

        <div id="themes">
            <header></header>  


            <main>
                <h1>Histoire</h1>
                <section>
                    <div></div>

                    <article id="container">
                    </article>
                    
                    <div class="dot-navigation">
                        <button id="buttonLess">
                            <i class="fa-solid fa-circle-chevron-left"></i>
                            <h3>to left content</h3>
                        </button>
                            <button>
                                <i id="btnDotOne" class="fa-solid fa-circle"></i>
                                <h3>First content</h3> 
                            </button>
                            <button>
                                <i id="btnDotTwo" class="fa-solid fa-circle-dot"></i>
                                <h3>Second content</h3> 
                            </button>
                            <button>
                                <i id="btnDotThree" class="fa-solid fa-circle-dot"></i>
                                <h3>Third content</h3> 
                            </button>
                        <button id="buttonMore"> 
                            <i class="fa-solid fa-circle-chevron-right"></i>
                            <h3>To right content</h3>
                        </button>
                    </div>
                </section>
            </main>

            <footer></footer>
        </div>

    <!-- Modules -->
        <script type="module">
            import { getLandscape } from '../modules/landscape.js';
            document.querySelector('.landscape').innerHTML += getLandscape("..");
        </script>        
        <script type="module">
            import { getHeader } from '../modules/header.js';
            document.querySelector('header').innerHTML = getHeader("..");
        </script>
        <script type="module">
            import { getFooter } from '../modules/footer.js';
            document.querySelector('footer').innerHTML = getFooter("..");
        </script>
    <!-- Fin modules -->

    </body>
</html>
