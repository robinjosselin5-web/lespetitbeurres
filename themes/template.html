<!DOCTYPE html>
<html lang="en">
    <head>
        <script src="https://kit.fontawesome.com/c4ab95abda.js" crossorigin="anonymous"></script>
        <script type="module">

            document.title = "Les petits beurres";

            <footer></footer>

    <!-- Modules -->
